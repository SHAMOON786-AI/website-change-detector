# nixpacks.toml — Railway deployment config for Puppeteer
[phases.setup]
nixPkgs = [
    "chromium",
    "nss",
    "freetype",
    "harfbuzz",
    "ca-certificates",
    "glib",
    "dbus",
    "fontconfig",
    "xorg.libXcomposite",
    "xorg.libXcursor",
    "xorg.libXdamage",
    "xorg.libXext",
    "xorg.libXfixes",
    "xorg.libXi",
    "xorg.libXrandr",
    "xorg.libXrender",
    "xorg.libXtst",
    "xorg.libX11",
    "gtk3",
    "alsa-lib",
    "at-spi2-atk",
    "cups",
    "libdrm",
    "libxshmfence",
    "mesa"
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/run/current-system/sw/bin/chromium"
NODE_ENV = "production"
