<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Watch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2e3150;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .logo {
      font-weight: 700;
      font-size: 14px;
      color: #ff7700;
    }
    .logo span { color: #e2e8f0; }
    .form-group {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 11px;
      color: #8892a4;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      background: #1a1d27;
      border: 1px solid #2e3150;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
      width: 100%;
    }
    input:focus, select:focus {
      border-color: #ff7700;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: #ff7700;
      color: #fff;
      margin-top: 6px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
      text-align: center;
    }
    .status.success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid #22c55e; display: block; }
    .status.error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; display: block; }
    .footer-link {
      display: block;
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: #4f8ef7;
      text-decoration: none;
    }
    .footer-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🔍 Website<span>Watch</span></div>
  </div>

  <div class="form-group">
    <label>Server URL</label>
    <input type="url" id="server-url" value="http://localhost:3000">
  </div>

  <div class="form-group">
    <label>Site Name</label>
    <input type="text" id="site-name" placeholder="Page Title">
  </div>

  <div class="form-group">
    <label>Target URL</label>
    <input type="url" id="site-url" placeholder="https://..." readonly>
  </div>

  <div class="form-group">
    <label>Check Interval</label>
    <select id="site-interval">
      <option value="900000">Every 15 min</option>
      <option value="1800000">Every 30 min</option>
      <option value="3600000" selected>Every 1 hour</option>
      <option value="21600000">Every 6 hours</option>
      <option value="86400000">Every 24 hours</option>
    </select>
  </div>

  <div class="form-group">
    <label>Keywords (Optional)</label>
    <input type="text" id="site-keywords" placeholder="e.g. price, sale, out of stock">
  </div>

  <div class="form-group">
    <label>CSS Watch Selector (Optional)</label>
    <input type="text" id="site-selector" placeholder=".main-content or #price">
  </div>

  <button class="btn" id="track-btn">🚀 Monitor This Page</button>
  <div class="status" id="status-box"></div>

  <a href="#" class="footer-link" id="open-dashboard">Open Web Dashboard ↗</a>

  <script src="popup.js"></script>
</body>
</html>
